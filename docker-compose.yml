services:
  db:
    image: postgres:16-alpine
    container_name: carbon_setu_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: carbon_setu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: carbon_setu_server
    restart: always
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgrespassword@db:5432/carbon_setu?schema=public}"
      DIRECT_URL: "${DIRECT_URL:-postgresql://postgres:postgrespassword@db:5432/carbon_setu?schema=public}"
      SESSION_SECRET: "${SESSION_SECRET:-dev_local_session_secret_change_in_production}"
      JWT_SECRET: "${JWT_SECRET:-dev_local_jwt_secret_change_in_production}"
      PORT: 3001
      NODE_ENV: "${NODE_ENV:-production}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:80}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@carbonsetu.in}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-AdminPassword@2026}"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: carbon_setu_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
